name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The toolchain this repository is formatted and tested with. Update it
  # deliberately: newer releases may format code differently.
  MOONBIT_INSTALL_VERSION: "0.10.17+093cb8f9c"

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC (Windows native backend)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Toolchain version
        run: moon version --all

      # The command-line tool depends on moonbitlang/x, and a fresh
      # installation has no registry index to resolve it.
      - name: Fetch the registry index
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Interface files are up to date
        shell: bash
        run: |
          moon info
          git diff --exit-code

      - name: Check wasm
        run: moon check --target wasm
      - name: Check wasm-gc
        run: moon check --target wasm-gc
      - name: Check js
        run: moon check --target js
      - name: Check native
        run: moon check --target native

      - name: Test wasm
        run: moon test --target wasm
      - name: Test wasm-gc
        run: moon test --target wasm-gc
      - name: Test js
        run: moon test --target js
      - name: Test native
        run: moon test --target native

      - name: Command line
        shell: bash
        run: |
          printf 'Hi, I was charged twice for my subscription this month.\nok\n' > "$RUNNER_TEMP/lines.txt"
          printf '1\teng\t0.680\treliable\n2\t-\t-\t-\n' > "$RUNNER_TEMP/expected.txt"
          for target in wasm wasm-gc js native; do
            echo "== $target"
            moon run cmd/main --target "$target" -- --file "$RUNNER_TEMP/lines.txt" > "$RUNNER_TEMP/actual.txt"
            diff --strip-trailing-cr "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          done

      - name: Benchmark results are up to date
        shell: bash
        run: |
          moon run eval/run --target wasm-gc > "$RUNNER_TEMP/results.md"
          diff --strip-trailing-cr "$RUNNER_TEMP/results.md" eval/results.md

  franc-data:
    name: franc data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Fetch the registry index
        run: moon update

      - name: Install franc-min 6.2.0 and franc 6.2.0
        run: |
          npm install --prefix "$RUNNER_TEMP/franc" --no-save --ignore-scripts franc-min@6.2.0
          npm install --prefix "$RUNNER_TEMP/franc-full" --no-save --ignore-scripts franc@6.2.0

      - name: Download franc 6.2.0 test fixtures
        run: curl -fsSL -o "$RUNNER_TEMP/fixtures.js" https://raw.githubusercontent.com/wooorm/franc/3f9f0b51a96c5df32a407dad865a3011ac0fa2d1/test/fixtures.js

      - name: Regenerate profiles and golden tests
        run: |
          node tools/gen_profiles.mjs "$RUNNER_TEMP/franc/node_modules/franc-min" profiles.mbt
          node tools/gen_golden.mjs "$RUNNER_TEMP/franc/node_modules/franc-min" "$RUNNER_TEMP/fixtures.js" golden_wbtest.mbt
          node tools/gen_full.mjs "$RUNNER_TEMP/franc-full/node_modules/franc" "$RUNNER_TEMP/fixtures.js" full
          moon fmt

      - name: Generated files match the committed ones
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Upload regenerated files
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: regenerated
          path: |
            profiles.mbt
            golden_wbtest.mbt
            full/data.mbt
            full/golden_test.mbt
